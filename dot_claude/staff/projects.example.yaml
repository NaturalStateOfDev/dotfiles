# Copy to ~/.claude/staff/projects.yaml and edit. That file is machine-local
# and is NOT synced by chezmoi (see .chezmoiignore). Keep real paths and
# internal names out of this example.
jira:
  site: example.atlassian.net
  cloud_id: <your atlassian cloud id>
  assignee_name: Your Name
  assignee_account_id: "<your atlassian account id>"   # Alfred only tracks/updates tickets assigned to this account
# Optional: keep records in an Obsidian vault ("vault mode"). Alfred then logs to
# <vault>/Projects/<vault_project>/ (hub log, Tasks/, Agent Records/) and follows
# the vault's AGENTS.md. Leave it out to use the local ledger in ~/.claude/staff/<slug>/.
# vault: "/path/to/your/vault"
projects:
  - name: example-app          # nickname you will say to Alfred
    slug: example-app          # staff dir ~/.claude/staff/<slug>/ (local, never in the repo): agent notes, plus the ledger when no vault is set
    # vault_project: Example App   # folder under <vault>/Projects/ (vault mode only)
    # jira_roots: [EX-1]           # optional: epics this project's work hangs under; narrows Alfred's reverse scan
    path: ~/src/example-app    # absolute or ~-relative repo path
    default_branch: main
    ticket_prefixes: [EX]      # Jira keys like EX-123 route here
    deploy: [github, terraform-ecs]   # any of: github, terraform-ecs, dbt
  - name: example-dbt
    slug: example-dbt
    path: ~/src/example-dbt
    default_branch: main
    ticket_prefixes: [DATA]
    deploy: [github, dbt]
