# Copy to ~/.claude/staff/projects.yaml and edit. That file is machine-local
# and is NOT synced by chezmoi (see .chezmoiignore). Keep real paths and
# internal names out of this example.
jira:
  site: example.atlassian.net
  cloud_id: <your atlassian cloud id>
  assignee_name: Your Name
  assignee_account_id: "<your atlassian account id>"   # Alfred only tracks/updates tickets assigned to this account
projects:
  - name: example-app          # nickname you will say to Alfred
    slug: example-app          # ledger, handoffs, tasks, reviews live in ~/.claude/staff/<slug>/ (local, never in the repo)
    path: ~/src/example-app    # absolute or ~-relative repo path
    default_branch: main
    ticket_prefixes: [EX]      # Jira keys like EX-123 route here
    deploy: [github, terraform-ecs]   # any of: github, terraform-ecs, dbt
  - name: example-dbt
    slug: example-dbt
    path: ~/src/example-dbt
    default_branch: main
    ticket_prefixes: [DATA]
    deploy: [github, dbt]
